# vim: set ft=yaml:
# Authelia Helm values for authelia-helm live stack.
# Secrets (encryption keys, jwt secret, smtp password) are NOT here.
# They are injected via sensitive_values_yaml in terragrunt.hcl from authelia_vars.sops.yaml.

image:
  tag: '4.39.20'

pod:
  kind: 'Deployment'

  replicas: 1

configMap:
  theme: 'light'

  log:
    level: 'info'
    format: 'text'

  totp:
    issuer: '${domain}'

  authentication_backend:
    password_reset:
      disable: false
    refresh_interval: '5 minutes'
    # "file" or "ldap" are automatically wired by the module. Do not add them here.

  access_control:
    default_policy: 'deny'
    rules:
      # The Authelia portal itself must be bypassed so users can log in.
      - domain: 'auth.${domain}'
        policy: 'bypass'
      # Require single-factor for everything else under the domain.
      - domain: '*.${domain}'
        policy: 'one_factor'

  session:
    name: 'authelia_session'
    same_site: 'lax'
    expiration: '1 hour'
    inactivity: '30 minutes'
    remember_me: '1 month'

    cookies:
      - domain: '${domain}'
        subdomain: 'auth'

    # Redis/Valkey session backend is auto-wired by the module when valkey_enabled = true.
    # Do not configure session.redis here; it is injected via the module's valkey_* variables.

  regulation:
    modes:
      - 'user'
    max_retries: 3
    find_time: '2 minutes'
    ban_time: '5 minutes'

  storage:
    # Storage backend is auto-wired by the module via the db_type variable.
    # When db_type = "postgres", the module enables postgres and disables local.
    # When db_type = "sqlite", the module leaves this section alone and the
    # local block below takes effect.
    mysql:
      enabled: false
    postgres:
      enabled: false
    local:
      enabled: true
      path: '/config/db.sqlite3'

  notifier:
    disable_startup_check: false
    filesystem:
      enabled: false
      filename: '/config/notification.txt'
    smtp:
      enabled: true
      address: 'smtp://mail.smtp2go.com:2525'
      identifier: 'authelia'
      subject: '[Authelia] {title}'
      # smtp password is injected via sensitive_values_yaml in terragrunt.hcl

  identity_providers:
    oidc:
      cors:
        endpoints:
          - authorization
          - token
          - revocation
          - introspection
          - userinfo
        allowed_origins_from_client_redirect_uris: true
      authorization_policies: {}
        # default_policy: one_factor
              #   policy_name:
      #     default_policy: 'deny'
      #     rules:
      #       - policy: 'two_factor'
      #         subject: 'user:abc'
      clients:
        - client_id: paperless
          client_name: Paperless-ngx
          client_secret: '$argon2id$v=19$m=65536,t=3,p=4$PA61hTHjul7VjUyVrprMyA$ii07jnPy62yawoz3c5mWDPEZ9h4eMoODexbbMBXo7qA'
          public: false
          authorization_policy: one_factor
          redirect_uris:
            - 'https://paperless.${domain}/accounts/oidc/authelia/login/callback/'
          scopes:
            - openid
            - profile
            - email
            - groups
          userinfo_signed_response_alg: none
        - client_id: homebox
          client_name: Homebox
          client_secret: '$argon2id$v=19$m=65536,t=3,p=4$bkiIEfb9DPRKndh/KyFiqQ$JPA8VW+9cS5kSr3ixogP/Di0W3BAYn2SNway0vHY+S8'
          public: false
          authorization_policy: one_factor
          redirect_uris:
            - 'https://homebox.${domain}/api/v1/oauth/callback'
          scopes:
            - openid
            - profile
            - email
          userinfo_signed_response_alg: none

persistence:
  # Persist the SQLite database across pod restarts.
  enabled: false
  storageClass: 'nfs-retain'
  size: '500Mi'
  accessModes:
    - 'ReadWriteOnce'
