# vim: set ft=yaml:
# Authelia Helm values for authelia-helm live stack.
# Secrets (encryption keys, jwt secret, smtp password) are NOT here.
# They are injected via sensitive_values_yaml in terragrunt.hcl from authelia_vars.sops.yaml.

image:
  tag: '4.39.19'

pod:
  kind: 'Deployment'

  replicas: 1

configMap:
  theme: 'light'

  log:
    level: 'info'
    format: 'text'

  totp:
    issuer: 'easontm.com'

  authentication_backend:
    password_reset:
      disable: false
    refresh_interval: '5 minutes'
    # "file" or "ldap" are automatically wired by the module. Do not add them here.

  access_control:
    default_policy: 'deny'
    rules:
      # The Authelia portal itself must be bypassed so users can log in.
      - domain: 'auth.easontm.com'
        policy: 'bypass'
      # Require single-factor for everything else under the domain.
      - domain: '*.easontm.com'
        policy: 'one_factor'

  session:
    name: 'authelia_session2'  # TODO: revert
    same_site: 'lax'
    expiration: '1 hour'
    inactivity: '30 minutes'
    remember_me: '1 month'

    cookies:
      - domain: 'authelia.easontm.com'  # TODO: revert to just domain
        # subdomain: 'auth'
        # subdomain: 'authelia'
        # default_redirection_url: 'https://easontm.com'

    # Redis/Valkey session backend is auto-wired by the module when valkey_enabled = true.
    # Do not configure session.redis here; it is injected via the module's valkey_* variables.

  regulation:
    modes:
      - 'user'
    max_retries: 3
    find_time: '2 minutes'
    ban_time: '5 minutes'

  storage:
    # Storage backend is auto-wired by the module via the db_type variable.
    # When db_type = "postgres", the module enables postgres and disables local.
    # When db_type = "sqlite", the module leaves this section alone and the
    # local block below takes effect.
    mysql:
      enabled: false
    postgres:
      enabled: false
    local:
      enabled: true
      path: '/config/db.sqlite3'

  notifier:
    disable_startup_check: false
    filesystem:
      enabled: false
      filename: '/config/notification.txt'
    smtp:
      enabled: true
      address: 'smtp://mail.smtp2go.com:2525'
      # sender: 'Authelia <authelia@easontm.com>'
      identifier: 'authelia'
      subject: '[Authelia] {title}'
      # smtp password is injected via sensitive_values_yaml in terragrunt.hcl

persistence:
  # Persist the SQLite database across pod restarts.
  enabled: false
  storageClass: 'nfs-retain'
  size: '500Mi'
  accessModes:
    - 'ReadWriteOnce'
