# vim: set ft=yaml:
# Authelia Helm values for authelia-helm live stack.
# Secrets (encryption keys, jwt secret, smtp password, users DB) are NOT here.
# They are injected via sensitive_values_yaml in terragrunt.hcl from authelia_vars.sops.yaml.

image:
  tag: '4.39.19'

pod:
  kind: 'Deployment'

  replicas: 1

  # Mount the users database from a secret created via extraObjects in sensitive_values_yaml.
  extraVolumes:
    - name: users-database
      secret:
        secretName: authelia-users-db

  extraVolumeMounts:
    - name: users-database
      mountPath: /config/users_database.yml
      subPath: users_database.yml
      readOnly: true

configMap:
  theme: 'light'

  log:
    level: 'info'
    format: 'text'

  totp:
    issuer: 'easontm.com'

  authentication_backend:
    password_reset:
      disable: false
    refresh_interval: '5 minutes'
    file:
      enabled: true
      path: '/config/users_database.yml'
      watch: true
      search:
        email: false
        case_insensitive: false

  access_control:
    default_policy: 'deny'
    rules:
      # The Authelia portal itself must be bypassed so users can log in.
      - domain: 'auth.easontm.com'
        policy: 'bypass'
      # Require single-factor for everything else under the domain.
      - domain: '*.easontm.com'
        policy: 'one_factor'

  session:
    name: 'authelia_session'
    same_site: 'lax'
    expiration: '1 hour'
    inactivity: '30 minutes'
    remember_me: '1 month'

    cookies:
      - domain: 'easontm.com'
        # subdomain: 'auth'
        subdomain: 'authelia'
        default_redirection_url: 'https://easontm.com'

    # Redis/Valkey session backend is auto-wired by the module when valkey_enabled = true.
    # Do not configure session.redis here; it is injected via the module's valkey_* variables.

  regulation:
    modes:
      - 'user'
    max_retries: 3
    find_time: '2 minutes'
    ban_time: '5 minutes'

  storage:
    # Explicitly disable non-local backends.
    mysql:
      enabled: false
    postgres:
      enabled: false
    # Use SQLite for local storage.
    local:
      enabled: true
      path: '/config/db.sqlite3'

  notifier:
    disable_startup_check: false
    filesystem:
      enabled: true
      filename: '/config/notification.txt'
    smtp:
      enabled: false
      # TODO: set your SMTP server — e.g. submission://smtp.sendgrid.net:587
      address: 'submission://smtp.example.com:587'
      sender: 'Authelia <authelia@easontm.com>'
      identifier: 'authelia'
      subject: '[Authelia] {title}'
      startup_check_address: 'authelia@easontm.com'
      # smtp password is injected via sensitive_values_yaml in terragrunt.hcl

persistence:
  # Persist the SQLite database across pod restarts.
  enabled: false
  storageClass: 'nfs-retain'
  size: '500Mi'
  accessModes:
    - 'ReadWriteOnce'
